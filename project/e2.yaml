scope:
  includes:
    - one controlled Primary Evaluation Cohort
    - an Operational Attempt Ledger for every admitted Dialing Attempt
    - outbound conversations and speech interaction
    - executable appointment outcomes
    - evidence accounting, labeling, and failure attribution
    - separate reporting of non-evaluable attempts for infrastructure iteration
    - a permanent consent-qualified Benchmark Evidence Archive for future internal comparisons
    - DR-5 post-run decision
  excludes:
    - CRM or DMS integration
    - dashboards
    - WhatsApp or inbound calling
    - multi-agent or multitenant operation
    - E3 or E4 work
    - copied AugloAI runtime code

evidence:
  required:
    - Primary Evaluation Cohort manifest reference
    - Operational Attempt Ledger reference
    - Snapshot Digest
    - Behavior Hash
    - per-attempt Attempt Evidence reference
    - per-attempt outcome
    - per-attempt valid Outcome label and labeling timestamp
    - founder review confirmation for every admitted Dialing Attempt
    - initial Failure Attribution triage and triage timestamp when unsuccessful or incomplete
    - founder review confirmation of initial Failure Attribution triage when applicable
    - model recommendation provenance and evidence references when model assistance is used
    - Failure Attribution when applicable
    - frozen Closure Candidate digest and bound records
    - Closure Amendment references when applicable
    - superseding DR-5 Product Chronicle event reference when an amendment requires it
    - DR-5 Product Chronicle event reference
    - call-duration timestamps and events proving the 240-second transition, closure-window behavior, and terminal cutoff or termination when applicable
    - passing Pre-Run Behavioral Readiness result binding the suite version, exact Behavior Hash, timestamp, runner identity/version, and evidence digest
    - preserved mandatory provider-neutral simulated appointment protocol evidence covering negotiation, availability, confirmation, a stable idempotency key bound to the simulated write, same-request replay without duplication and with the same authoritative appointment identity and consistent result, distinct keys for different logical booking requests, authoritative reread, truthful failure behavior, and verified-success termination
    - when real appointment booking is advertised, preserved live Adapter canary evidence binding the cohort's exact Adapter/configuration and proving the same write-bound idempotency, replay, distinct-request key, authoritative reread/propagation, and cleanup or designated test-record handling contract
    - preserved mandatory and diagnostic readiness scenario results with stable scenario IDs/versions and evidence references
    - Benchmark Evidence Archive references, hashes, non-sensitive metadata, and current availability/completeness
    - Evidence Retention Attestations when raw evidence is deleted or restricted
  git_representation: stable_id_or_hash_only
  sensitive_material_location: encrypted Controlled Storage outside Git

